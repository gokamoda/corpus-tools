[project]
name = "corpus-tools"
version = "0.1.0"
description = "Hash sampling and n-gram counting of Hugging Face corpora"
authors = [
    { name = "gokamoda", email = "gokamoda@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datasets>=3.2.0",
    "numpy>=2.0",
    "tqdm>=4.67.1",
]

[project.optional-dependencies]
count = [
    "transformers>=5.0",
    "tokenizer-tools",
    "scipy>=1.14.1",
]

[tool.uv.sources]
tokenizer-tools = { git = "https://github.com/gokamoda/tokenizer-tools.git", rev = "6ad2efe" }

[project.scripts]
corpus-tools = "corpus_tools.cli:entry"

[tool.uv]
dev-dependencies = [
    "pytest>=8.3.4",
    "ruff>=0.7.2",
    "ty>=0.0.5",
]

[tool.pytest.ini_options]
testpaths = ["src"]
python_files = ["*_test.py"]
markers = [
    "network: downloads data or tokenizers from the Hugging Face Hub (run with -m network)",
]
addopts = "-m 'not network'"

[tool.ruff]
exclude = [".git", ".mypy_cache", ".ruff_cache", ".venv"]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
fixable = ["ALL"]
unfixable = []
select = [
    "A",  # flake8-builtin
    "B",  # flake8-bugbear
    "E",  # pycodestyle error
    "F",  # Pyflakes
    "I",  # isort
    "N",  # pep8-naming
    "W",  # pycodestyle warning
    "PL",  # Pylint
    "UP",  # pyupgrade
]
ignore = [
    "B905",  # Zip-without-explicit-strict
    "E501",  # Line too long, handled by the formatter
    "N803",  # Argument name should be lowercase
    "N806",  # Variable in function should be lowercase
    "PLR0912",  # Too many branches
    "PLR0913",  # Too many arguments in function definition
    "PLR0915",  # Too many statements in function
    "PLC0415",  # import inside a function: transformers and scipy are optional ([count])
    "PLR2004",  # Magic value used in comparison
]

[tool.ruff.format]
quote-style = "double"
line-ending = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/corpus_tools"]
exclude = ["*_test.py", "testdata"]
